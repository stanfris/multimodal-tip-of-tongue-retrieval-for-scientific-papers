# @package _global_

defaults:
  - override /model: gemma4_judge

stage:
  name: judge_queries
  limit: null
launcher:
  environment:
    VLLM_ENABLE_V1_MULTIPROCESSING: '1'
    VLLM_WORKER_MULTIPROC_METHOD: spawn
    VLLM_USE_V2_MODEL_RUNNER: '0'
visual_query:
  judgement:
    model: ${model.name}
    provider: ${model.provider}

hydra:
  job:
    name: judge_queries
  run:
    dir: ${launcher.log_root}/query_generation/judge_queries/${now:%Y%m%dT%H%M%S}
  sweep:
    dir: ${launcher.log_root}/query_generation/judge_queries/${now:%Y%m%dT%H%M%S}
    subdir: ${hydra.job.num}
